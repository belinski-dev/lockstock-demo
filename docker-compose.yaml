x-app: &app
  image: lockstock-app
  pull_policy: never
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

x-app-env: &app-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lockstock
  SPRING_DATASOURCE_USERNAME: demo
  SPRING_DATASOURCE_PASSWORD: demo
  APP_SEED_ON_STARTUP: "true"

services:
  app-a:
    build: .
    <<: *app
    container_name: lockstock-app-a
    environment:
      <<: *app-env
      APP_INSTANCE_ID: "instance-A"

  app-b:
    <<: *app
    container_name: lockstock-app-b
    depends_on:
      app-a:
        condition: service_started
    environment:
      <<: *app-env
      APP_INSTANCE_ID: "instance-B"

  app-c:
    <<: *app
    container_name: lockstock-app-c
    depends_on:
      app-a:
        condition: service_started
    environment:
      <<: *app-env
      APP_INSTANCE_ID: "instance-C"

  postgres:
    image: postgres:16-alpine
    container_name: lockstock-postgres
    environment:
      POSTGRES_DB: lockstock
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=200ms
      - -c
      - lock_timeout=5s
      - -c
      - statement_timeout=10s
      # Show every statement (for FOR UPDATE / SKIP LOCKED) in the DB log
      - -c
      - log_statement=all
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
      - -c
      - log_min_duration_statement=0
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_activity_query_size=2048
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d lockstock" ]
      interval: 2s
      timeout: 3s
      retries: 15
