spring:
  application:
    name: lockstock-postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/lockstock
    username: demo
    password: demo
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 0
  sql:
    init:
      mode: always
      continue-on-error: true

logging:
  level:
    org.springframework.jdbc.datasource.init: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %msg%n"

app:
  instance-id: ${INSTANCE_ID:${random.uuid}}
  seed-on-startup: true

